[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logimouse"
dynamic = ["version"]
description = "Mouses Logitech e headsets MCHOSE no Linux: DPI, botões, macros, equalizador e microfone sem ruído"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "felipecscontanova-glitch" }]
keywords = ["logitech", "mouse", "hidpp", "dpi", "battery", "linux"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
# Sem dependencias do PyPI. O painel usa GTK 4 + libadwaita (PyGObject com cairo),
# ou o Tkinter se eles faltarem; o icone na barra usa o PyGObject + AyatanaAppIndicator
# do sistema: instale-os pelo gerenciador de pacotes (o instalar.sh faz isso).

[project.urls]
Homepage = "https://github.com/felipecscontanova-glitch/logimouse"

[project.scripts]
logimouse = "logimouse.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "logimouse.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logimouse = ["assets/*.svg"]
