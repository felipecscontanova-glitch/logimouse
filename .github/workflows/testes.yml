name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # o Python 3.9 (versao minima do app) nao existe para o Ubuntu 26.04 dos runners novos
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -m compileall -q src tests
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Modo terminal com o mouse simulado
        run: PYTHONPATH=src python -m logimouse --demo --cli

  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar GTK 4, libadwaita, Tkinter e tela virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11
      - name: Testes do painel antigo (Tkinter)
        run: xvfb-run -a /usr/bin/python3 -m unittest tests.test_gui -v
      - name: Testes do painel novo (GTK 4)
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest tests.test_window -v

  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o script
        run: |
          bash -n instalar.sh
          shellcheck -S warning instalar.sh
